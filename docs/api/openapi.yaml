openapi: 3.1.0
info:
  title: Uno HTTP API
  version: "1"
  description: |
    Every route the Uno server registers: the builder API under `/api`, which
    the web app uses, and the public Stremio addon routes under `/u/{token}`,
    which Nuvio's apps read.

    `TestOpenAPISpecMatchesRoutes` (internal/api/openapi_test.go) checks that
    every method and path here reaches a registered route, and that every
    registered route is here. It doesn't check request or response shapes.
    Those are written from the handlers' Go structs.

    Every error from a route under `/api` is a JSON `Error` body. The addon
    routes answer errors in plain text.

    Request bodies are decoded strictly: an unknown field is a `400` that names
    it, and a body over 1 MiB (4 MiB for import) is a `413`.

    `/config.js` is served by the web app handler, outside this route table.
  license:
    name: MIT
servers:
  - url: http://localhost:8123
    description: Local server
tags:
  - name: server
    description: Health and server settings. No sign-in.
  - name: profiles
    description: The signed-in account's Nuvio profiles.
  - name: library
    description: A profile's catalogs and collections.
  - name: sharing
    description: Publishing, Community, and added copies.
  - name: bundles
    description: Export and import.
  - name: push
    description: Writing a profile's home screen into Nuvio.
  - name: tmdb
    description: TMDB lookups and recipe previews.
  - name: account
    description: The account's own TMDB key, in per-account key mode.
  - name: addon
    description: The public Stremio addon protocol. No sign-in.
security:
  - nuvioBearer: []

paths:
  /api/health:
    get:
      tags: [server]
      summary: Liveness probe
      description: Reads nothing, so it answers even when the database or Nuvio is unreachable.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/config:
    get:
      tags: [server]
      summary: The server's TMDB key mode
      security: []
      responses:
        "200":
          description: How this server reaches TMDB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"

  /api/profiles:
    get:
      tags: [profiles]
      summary: List the account's Nuvio profiles
      responses:
        "200":
          description: The profiles, as Nuvio lists them, with each one's avatar image.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NuvioProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/profiles/select:
    post:
      tags: [profiles]
      summary: Pick a profile
      description: |
        Checks the slot against the account's live Nuvio profiles, then finds
        or creates the Uno profile for it. Returns the profile's addon manifest URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_index]
              additionalProperties: false
              properties:
                profile_index:
                  type: integer
                  minimum: 1
                  maximum: 6
      responses:
        "200":
          description: The profile's manifest URL.
          content:
            application/json:
              schema:
                type: object
                required: [manifest_url]
                properties:
                  manifest_url:
                    type: string
                    format: uri
                    examples: ["https://uno.example.com/u/abc123/manifest.json"]
        "400":
          description: Bad body, or the account has no profile at that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/p/{profileIndex}/library:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    get:
      tags: [library]
      summary: Load the profile's library
      description: Listed catalogs, collections with folders, what a push would change, and the Home revision. Read in one snapshot.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/catalogs:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [library]
      summary: Create a listed catalog
      description: Checks the recipe (against TMDB where needed) and stores its params in canonical form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogForm"
      responses:
        "201":
          description: The new catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/p/{profileIndex}/catalogs/{catalogID}:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/catalogID"
    put:
      tags: [library]
      summary: Save a listed catalog
      description: Refused with 409 when `revision` isn't the row's current revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSave"
      responses:
        "200":
          description: The saved catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }
    delete:
      tags: [library]
      summary: Delete a catalog
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/catalogs/{catalogID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/catalogID"
    post:
      tags: [library]
      summary: Duplicate a catalog
      description: Creates an independent listed copy, its name suffixed " (copy)".
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/catalogs/{catalogID}/publish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/catalogID"
    post:
      tags: [sharing]
      summary: Publish a catalog
      description: Publishes the catalog's current content, or replaces the snapshot of its existing publication.
      responses:
        "200":
          description: The catalog, with its publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/catalogs/{catalogID}/unpublish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/catalogID"
    post:
      tags: [sharing]
      summary: Unpublish a catalog
      description: Ends the publication. Subscribers keep their copies as their own.
      responses:
        "200":
          description: The catalog, with no publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/catalogs/{catalogID}/changes-since-publish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/catalogID"
    get:
      tags: [sharing]
      summary: What publishing the catalog again would change
      responses:
        "200":
          description: The changes, removed first, then added, then changed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnapshotChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/collections:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [library]
      summary: Create a collection
      description: Folder entries may create new catalogs scoped to the collection, in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionForm"
      responses:
        "201":
          description: The new collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/p/{profileIndex}/collections/{collectionID}:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/collectionID"
    put:
      tags: [library]
      summary: Save a collection
      description: |
        Replaces the collection's fields and folders. `catalog_edits` rewrites
        catalogs already scoped to it. Refused with 409 when `revision` isn't
        the row's current revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionSave"
      responses:
        "200":
          description: The saved collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }
    delete:
      tags: [library]
      summary: Delete a collection
      description: Its folders and scoped catalogs are deleted with it.
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/collections/{collectionID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/collectionID"
    post:
      tags: [library]
      summary: Duplicate a collection
      description: Creates an independent copy, with copies of its scoped catalogs.
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/collections/{collectionID}/publish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/collectionID"
    post:
      tags: [sharing]
      summary: Publish a collection
      responses:
        "200":
          description: The collection, with its publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/collections/{collectionID}/unpublish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/collectionID"
    post:
      tags: [sharing]
      summary: Unpublish a collection
      responses:
        "200":
          description: The collection, with no publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/collections/{collectionID}/changes-since-publish:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/collectionID"
    get:
      tags: [sharing]
      summary: What publishing the collection again would change
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnapshotChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    get:
      tags: [sharing]
      summary: One page of Community
      description: Other profiles' live publications on this server, 50 to a page.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [catalog, collection] }
        - name: sort
          in: query
          required: true
          schema: { type: string, enum: [newest, name] }
        - name: q
          in: query
          description: Words that must each appear in the title or a catalog's name. At most 200 characters and 8 words.
          schema: { type: string }
        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community/{publicationID}:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/publicationID"
    get:
      tags: [sharing]
      summary: One publication with its snapshot
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community/{publicationID}/subscribe:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/publicationID"
    post:
      tags: [sharing]
      summary: Add a publication
      description: Creates a linked copy in the caller's library.
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community/{publicationID}/changes:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/publicationID"
    get:
      tags: [sharing]
      summary: What Update would change in the caller's copy
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnapshotChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community/{publicationID}/update:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/publicationID"
    post:
      tags: [sharing]
      summary: Update the caller's copy
      description: Rewrites the copy from the publication's current snapshot.
      responses:
        "200":
          description: The updated copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/community/{publicationID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
      - $ref: "#/components/parameters/publicationID"
    post:
      tags: [sharing]
      summary: Duplicate a publication
      description: Creates an independent copy with no link to the publication.
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/export:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [bundles]
      summary: Export catalogs and collections as a bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                catalog_ids:
                  type: array
                  description: Listed catalogs to export.
                  items: { type: string, format: uuid }
                collection_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/p/{profileIndex}/import/check:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [bundles]
      summary: Check a bundle before importing it
      description: Validates the bundle and reports what each item matches in the caller's library. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              additionalProperties: false
              properties:
                bundle: { $ref: "#/components/schemas/Bundle" }
      responses:
        "200":
          description: What the bundle holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/p/{profileIndex}/import:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [bundles]
      summary: Import a bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              additionalProperties: false
              properties:
                bundle: { $ref: "#/components/schemas/Bundle" }
                reuse:
                  type: object
                  description: Bundle catalog keys to point at one of the caller's existing listed catalogs instead of importing.
                  additionalProperties: { type: string, format: uuid }
                skip_collections:
                  type: array
                  description: Positions of bundle collections to leave out, with their own catalogs.
                  items: { type: integer, minimum: 0 }
      responses:
        "201":
          description: The new listed catalogs and collections. Reused catalogs aren't included.
          content:
            application/json:
              schema:
                type: object
                required: [catalogs, collections]
                properties:
                  catalogs:
                    type: array
                    items: { $ref: "#/components/schemas/Catalog" }
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/Upstream" }

  /api/p/{profileIndex}/push:
    parameters:
      - $ref: "#/components/parameters/profileIndex"
    post:
      tags: [push]
      summary: Push the home screen to Nuvio
      description: |
        Writes the addon, the collections and the home-order list into the
        profile's Nuvio profile, then stores the new Home and the push record.
        If any Nuvio step fails, the earlier ones are put back. Once the body
        decodes, every answer is a `PushResult`, whatever its status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
      responses:
        "200":
          description: Pushed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400":
          description: Bad body (an `Error`), a bad row list, or `refused` is `empty_collection` or `too_many_catalogs`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PushResult"
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "409":
          description: Home changed since `home_revision` (no `refused`), or `refused` is `profile_changed` or `shares_addons`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500":
          description: Failed on Uno's side. `undo_failed` is true when putting back Nuvio's lists failed too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "502":
          description: Nuvio failed. `refused` is `home_order_unreadable` when its home-order list couldn't be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "503":
          description: Another push of this profile didn't finish within 5 seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }

