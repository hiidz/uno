    parameters:
      - $ref: "#/components/parameters/AddonToken"
    get:
      tags: [addon]
      operationId: addonConfigure
      summary: The addon's Configure action
      description: Nuvio's addon managers open this; it sends the browser to the builder.
      security: []
      responses:
        "302":
          description: Redirect to the builder's profile picker.
          headers:
            Location:
              schema:
                type: string
                const: /profiles

  /u/{token}/catalog/{type}/{id}.json:
    parameters:
      - $ref: "#/components/parameters/AddonToken"
      - $ref: "#/components/parameters/AddonCatalogType"
      - $ref: "#/components/parameters/AddonCatalogID"
    get:
      tags: [addon]
      operationId: addonCatalog
      summary: The first page of one catalog
      description: |
        Stremio addon protocol: twenty titles. Serves only a catalog the
        manifest lists. Public and CORS-open.
      security: []
      responses:
        "200": { $ref: "#/components/responses/AddonCatalogPage" }
        "404": { $ref: "#/components/responses/AddonCatalogNotServed" }
        "502": { $ref: "#/components/responses/AddonUpstream" }

  /u/{token}/catalog/{type}/{id}/{extra}.json:
    parameters:
      - $ref: "#/components/parameters/AddonToken"
      - $ref: "#/components/parameters/AddonCatalogType"
      - $ref: "#/components/parameters/AddonCatalogID"
      - name: extra
        in: path
        required: true
        description: |
          Stremio extra props as a URL-encoded query string in one path
          segment: `skip` (titles the client already holds) and `genre` (a
          name from the catalog's genre extra), e.g. `genre=Action&skip=20`.
          A `skip` past TMDB's page-500 ceiling answers an empty page.
        schema:
          type: string
        example: skip=20
    get:
      tags: [addon]
      operationId: addonCatalogExtra
      summary: A later page or genre of one catalog
      description: As the first page, from `skip` on, narrowed to `genre`.
      security: []
      responses:
        "200": { $ref: "#/components/responses/AddonCatalogPage" }
        "404": { $ref: "#/components/responses/AddonCatalogNotServed" }
        "502": { $ref: "#/components/responses/AddonUpstream" }

components:
  securitySchemes:
    nuvioBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Nuvio access token, verified against Nuvio's signing keys.

  parameters:
    ProfileIndex:
      name: profileIndex
      in: path
      required: true
      description: The Nuvio profile slot.
      schema:
        type: integer
        minimum: 1
        maximum: 6
    CatalogID:
      name: catalogID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionID:
      name: collectionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicationID:
      name: publicationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TypePath:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CatalogType"
    TMDBID:
      name: id
      in: path
      required: true
      description: A TMDB id.
      schema:
        type: integer
    SearchQuery:
      name: q
      in: query
      required: true
      description: The search text; blank is a 400.
      schema:
        type: string
        minLength: 1
    AddonToken:
      name: token
      in: path
      required: true
      description: The profile's addon token, from its manifest URL.
      schema:
        type: string
    AddonCatalogType:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CatalogType"
    AddonCatalogID:
      name: id
      in: path
      required: true
      description: The catalog's manifest id, `{provider}-{catalog uuid}`.
      schema:
        type: string
        example: tmdb-3f2b8a52-0f4e-4a43-9a0e-6c1d2b7f9e10

  responses:
    BadRequest:
      description: The request is malformed or refused in words the caller can act on.
      content:
        text/plain:
          schema:
            type: string
    BadProfileIndex:
      description: The profile index isn't 1–6.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing, malformed, invalid or expired bearer token.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: The server's allowlist doesn't list this Nuvio account.
      content:
        text/plain:
          schema:
            type: string
    ProfileNotFound:
      description: >-
        The caller has no Uno profile in this slot. The body is JSON whose
        `code` is `profile_not_found`, which the builder tells apart from a
        route's own plain-text 404 by.
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
                const: profile not found
              code:
                type: string
                const: profile_not_found
    NotFound:
      description: No such row in this profile. A slot with no Uno profile answers `ProfileNotFound` instead.
      content:
        text/plain:
          schema:
            type: string
    PublicationGone:
      description: The publication isn't live in Community any more. A slot with no Uno profile answers `ProfileNotFound` instead.
      content:
        text/plain:
          schema:
            type: string
    NotOnTMDB:
      description: TMDB has no such id.
      content:
        text/plain:
          schema:
            type: string
    SharedKeyMode:
      description: The server shares one TMDB key; accounts have none of their own.
      content:
        text/plain:
          schema:
            type: string
    PayloadTooLarge:
      description: The body is over its cap (1 MiB; 4 MiB for the import routes).
      content:
        text/plain:
          schema:
            type: string
    KeyProblem:
      description: Per-account key server only. The account has no TMDB key yet, or TMDB doesn't accept it.
      content:
        text/plain:
          schema:
            type: string
    TMDBUnavailable:
      description: TMDB couldn't be reached, or the auth service is unavailable.
      content:
        text/plain:
          schema:
            type: string
    NuvioUnavailable:
      description: A Nuvio call failed, or the auth service is unavailable.
      content:
        text/plain:
          schema:
            type: string
    AddonCatalogPage:
      description: Up to twenty titles.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddonCatalogResponse"
    AddonCatalogNotServed:
      description: The token's profile has no such catalog on Nuvio.
      content:
        text/plain:
          schema:
            type: string
    AddonUpstream:
      description: TMDB couldn't be reached.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    CatalogType:
      type: string
      enum: [movie, series]
    Provider:
      type: string
      const: tmdb

    RecipeParams:
      type: object
      description: |
        A TMDB recipe. Which fields apply depends on the catalog type; a field
        the type doesn't know is refused. Rules: `docs/data-model.md`,
        *Recipe params (TMDB)*.
      properties:
        randomized: { type: boolean }
        sort_by: { type: string }
        with_genres: { type: string, description: "TMDB genre ids, comma (AND) or pipe (OR) separated." }
        without_genres: { type: string }
        with_original_language: { type: string }
        vote_average_gte: { type: number }
        vote_average_lte: { type: number }
        vote_count_gte: { type: integer }
        vote_count_lte: { type: integer }
        with_runtime_gte: { type: integer }
        with_runtime_lte: { type: integer }
        with_watch_providers: { type: string, description: Requires watch_region. }
        watch_region: { type: string }
        with_companies: { type: string }
        without_companies: { type: string }
        with_keywords: { type: string }
        without_keywords: { type: string }
        certification: { type: string }
        certification_gte: { type: string }
        certification_lte: { type: string }
        certification_country: { type: string, description: Requires any certification field. }
        primary_release_date_gte: { type: string, format: date, description: movie only. }
        primary_release_date_lte: { type: string, format: date, description: movie only. }
        released_within_days: { type: integer, description: "movie only; excludes the primary_release_date fields." }
        with_collection: { type: string, description: "movie only; a TMDB collection id. Excludes every other field but randomized." }
        first_air_date_gte: { type: string, format: date, description: series only. }
        first_air_date_lte: { type: string, format: date, description: series only. }
        aired_within_days: { type: integer, description: "series only; excludes the first_air_date fields." }
        with_networks: { type: string, description: series only. }
    RecipeParamsString:
      type: string
      description: A `RecipeParams` object, JSON-encoded.
      contentMediaType: application/json
      contentSchema:
        $ref: "#/components/schemas/RecipeParams"
      example: '{"sort_by":"popularity.desc","with_genres":"28"}'

    ServerConfig:
      type: object
      required: [tmdb_key_mode]
      properties:
        tmdb_key_mode:
          type: string
          enum: [shared, per-account]
          description: Whether every account shares one TMDB key or brings its own.

    TMDBKeyStatus:
      type: object
      required: [set]
      properties:
        set:
          type: boolean
        last4:
          type: string
          description: The saved key's last four characters; absent when none is saved.

    PickerProfile:
      type: object
      description: One Nuvio profile as Nuvio lists it, plus the picture Nuvio's apps show.
      required: [id, user_id, profile_index, name, uses_primary_addons, avatar_color_hex, avatar_id, avatar_url, pin_enabled, avatar_image_url]
      properties:
        id: { type: string, description: Nuvio's profile id. }
        user_id: { type: string }
        profile_index: { type: integer }
        name: { type: string }
        uses_primary_addons:
          type: boolean
          description: The profile uses profile 1's addons; push refuses it.
        avatar_color_hex: { type: string }
        avatar_id: { type: string }
        avatar_url: { type: string }
        pin_enabled: { type: boolean }
        avatar_image_url:
          type: string
          description: Its own upload, else its built-in avatar's image; "" when it shows its colour.

    SelectedProfile:
      type: object
      required: [manifest_url]
      properties:
        manifest_url: { type: string, format: uri, description: The profile's addon manifest URL. }

    PublicationState:
      type: object
      description: The row's own publication.
      required: [id, changed_since_publish]
      properties:
        id: { type: string, format: uuid }
        changed_since_publish: { type: boolean }
    SubscriptionState:
      type: object
      description: The publication this row is a subscribed copy of.
      required: [publication_id, update_available]
      properties:
        publication_id: { type: string, format: uuid }
        update_available: { type: boolean }

    Catalog:
      type: object
      required: [id, type, name, provider, params, collection_id, show_in_home, publication, subscription, publisher_unpublished]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        params: { $ref: "#/components/schemas/RecipeParamsString" }
        collection_id:
          type: [string, "null"]
          format: uuid
          description: The collection this catalog is scoped to; null for a listed catalog.
        home_position:
          type: integer
          description: Its place on Home, one numbering shared with collections; absent when not on Home.
        show_in_home:
          type: boolean
          description: On Home with a home row of its own; false for Discover only, and for every catalog off Home. Written only by push.
        publication:
          oneOf:
            - $ref: "#/components/schemas/PublicationState"
            - type: "null"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionState"
            - type: "null"
        publisher_unpublished:
          type: boolean
          description: Was a subscribed copy until its publisher unpublished; cleared by the next save.
    CatalogForm:
      type: object
      required: [type, name, provider, params]
      properties:
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        params: { $ref: "#/components/schemas/RecipeParamsString" }

    ViewMode:
      type: string
      enum: [TABBED_GRID, ROWS, FOLLOW_LAYOUT]
      description: Empty is stored as TABBED_GRID.
    TileShape:
      type: string
      enum: [POSTER, LANDSCAPE, SQUARE]
      description: Empty is stored as POSTER.

    FolderArt:
      type: object
      description: A folder's tile and hero media.
      properties:
        title: { type: string }
        tile_shape: { $ref: "#/components/schemas/TileShape" }
        hide_title: { type: boolean }
        cover_emoji: { type: string }
        cover_image_url: { type: string }
        focus_gif_url: { type: string, description: "Played over the tile while focused, when focus_gif_enabled." }
        focus_gif_enabled: { type: boolean }
        hero_backdrop_url: { type: string }
        hero_video_url: { type: string }
        title_logo_url: { type: string }

    Folder:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          required: [id, title, tile_shape, hide_title, cover_emoji, cover_image_url, focus_gif_url, focus_gif_enabled, hero_backdrop_url, hero_video_url, title_logo_url, refs]
          properties:
            id: { type: string, format: uuid }
            refs:
              type: array
              description: The folder's catalogs, in order.
              items:
                $ref: "#/components/schemas/FolderRef"
    FolderRef:
      type: object
      required: [catalog_id, genre]
      properties:
        catalog_id: { type: string, format: uuid }
        genre:
          type: string
          description: The genre this catalog is narrowed to in this folder; "" for none.

    Collection:
      type: object
      required: [id, title, pin_to_top, view_mode, show_all_tab, backdrop_image_url, focus_glow_enabled, publication, subscription, publisher_unpublished, folders, catalogs]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        pin_to_top: { type: boolean, description: Nuvio shows it first; written only by push. }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string }
        focus_glow_enabled: { type: boolean }
        home_position:
          type: integer
          description: Its place on Home, one numbering shared with catalogs; absent when not on Home.
        publication:
          oneOf:
            - $ref: "#/components/schemas/PublicationState"
            - type: "null"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionState"
            - type: "null"
        publisher_unpublished: { type: boolean }
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        catalogs:
          type: array
          description: The catalogs scoped to this collection.
          items:
            $ref: "#/components/schemas/Catalog"

    CollectionForm:
      type: object
      required: [title]
      properties:
        title: { type: string }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string }
        focus_glow_enabled: { type: boolean }
        folders:
          type: array
          items:
            $ref: "#/components/schemas/FolderForm"
        catalog_edits:
          type: array
          description: Update only. Rewrites catalogs already scoped to this collection, in the same transaction.
          items:
            $ref: "#/components/schemas/ScopedCatalogEdit"
    FolderForm:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: An existing folder's id; absent for a new folder.
            catalogs:
              type: array
              description: The folder's catalogs, in order.
              items:
                $ref: "#/components/schemas/FolderCatalogRef"
    FolderCatalogRef:
      type: object
      description: An existing catalog by id, or a new catalog scoped to the collection.
      oneOf:
        - required: [catalog_id]
        - required: [new]
      properties:
        catalog_id: { type: string, format: uuid }
        new: { $ref: "#/components/schemas/NewScopedCatalog" }
        genre: { type: string }
    NewScopedCatalog:
      type: object
      required: [key, type, name, provider, params]
      properties:
        key:
          type: string
          description: The client's handle for one staged catalog; every `new` with the same key in one save is the one catalog. Never stored.
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        provider: { $ref: "#/components/schemas/Provider" }
        params: { $ref: "#/components/schemas/RecipeParamsString" }
    ScopedCatalogEdit:
      type: object
      required: [id, type, provider, name, params]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CatalogType" }
        provider: { $ref: "#/components/schemas/Provider" }
        name: { type: string }
        params: { $ref: "#/components/schemas/RecipeParamsString" }

    Preview:
      type: object
      required: [randomized, items, total_results]
      properties:
        randomized:
          type: boolean
          description: The recipe shuffles, so page 1 won't match what Nuvio shows.
        items:
          type: array
          items:
            $ref: "#/components/schemas/PreviewItem"
        total_results:
          type: integer
          description: TMDB's count of matches across every page.
    PreviewItem:
      type: object
      required: [tmdb_id, title, year]
      properties:
        tmdb_id: { type: integer }
        title: { type: string }
        year: { type: string }
        poster: { type: string }

    BundleCatalog:
      type: object
      required: [key, name, type, provider, params]
      properties:
        key: { type: string, description: Unique across the bundle or snapshot. }
        name: { type: string }
        type: { $ref: "#/components/schemas/CatalogType" }
        provider: { $ref: "#/components/schemas/Provider" }
        params: { $ref: "#/components/schemas/RecipeParams" }
    BundleRef:
      type: object
      required: [catalog, genre]
      properties:
        catalog: { type: string, description: A catalog's key. }
        genre: { type: string }
    BundleFolder:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          required: [refs]
          properties:
            refs:
              type: array
              items:
                $ref: "#/components/schemas/BundleRef"
    BundleCollection:
      type: object
      required: [title, catalogs, folders]
      properties:
        title: { type: string }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string }
        focus_glow_enabled: { type: boolean }
        catalogs:
          type: array
          description: The catalogs scoped to this collection.
          items:
            $ref: "#/components/schemas/BundleCatalog"
        folders:
          type: array
          items:
            $ref: "#/components/schemas/BundleFolder"
    Bundle:
      type: object
      description: Catalogs and collections with every row id replaced by a key. Format rules in `docs/data-model.md`, *Bundle format*.
      required: [format, version, catalogs, collections]
      properties:
        format: { type: string, const: uno }
        version: { type: integer, const: 1 }
        catalogs:
          type: array
          description: Listed catalogs.
          items:
            $ref: "#/components/schemas/BundleCatalog"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/BundleCollection"

    ImportCheck:
      type: object
      required: [catalogs, collections]
      properties:
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/CheckCatalog"
        collections:
          type: array
          items:
            type: object
            required: [title, folders, matched, catalogs]
            properties:
              title: { type: string }
              folders:
                type: array
                description: Folder titles, in order.
                items: { type: string }
              matched:
                type: boolean
                description: One of the caller's collections has this title, trimmed and in any case.
              catalogs:
                type: array
                items:
                  $ref: "#/components/schemas/CheckCatalog"
    CheckCatalog:
      type: object
      required: [key, name, type, params, existing]
      properties:
        key: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/CatalogType" }
        params: { $ref: "#/components/schemas/RecipeParamsString" }
        existing:
          type: array
          description: The caller's listed catalogs with the same recipe, by name then id; what `reuse` may name.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    CommunityItem:
      type: object
      description: One publication as Community lists it. Its publisher is never on the wire.
      required: [id, kind, title, subscriber_count, published_at, updated_at, subscribed, update_available, catalog_names, folders, catalog]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [catalog, collection]
        title: { type: string }
        subscriber_count: { type: integer }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        subscribed: { type: boolean }
        update_available: { type: boolean }
        catalog_names:
          type: array
          items: { type: string }
        folders:
          type: array
          description: A collection's folders in order, as their tiles show them.
          items:
            type: object
            required: [title, tile_shape, cover_emoji, cover_image_url]
            properties:
              title: { type: string }
              tile_shape: { $ref: "#/components/schemas/TileShape" }
              cover_emoji: { type: string }
              cover_image_url: { type: string }
        catalog:
          description: A catalog publication's recipe; null for a collection.
          oneOf:
            - $ref: "#/components/schemas/BundleCatalog"
            - type: "null"
    PublicationDetail:
      allOf:
        - $ref: "#/components/schemas/CommunityItem"
        - type: object
          required: [snapshot]
          properties:
            snapshot:
              $ref: "#/components/schemas/Snapshot"
    Snapshot:
      type: object
      description: What a publication holds. A catalog publication holds one catalog and no collection.
      required: [format, version, catalogs]
      properties:
        format: { type: string, const: uno-publication }
        version: { type: integer, const: 1 }
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/BundleCatalog"
        collection:
          type: object
          required: [title, view_mode, show_all_tab, backdrop_image_url, focus_glow_enabled, folders]
          properties:
            title: { type: string }
            view_mode: { $ref: "#/components/schemas/ViewMode" }
            show_all_tab: { type: boolean }
            backdrop_image_url: { type: string }
            focus_glow_enabled: { type: boolean }
            folders:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/BundleFolder"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string }
    CommunityCopy:
      type: object
      description: The row an add, Update or Duplicate wrote; `catalog` or `collection` by `kind`.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [catalog, collection]
        catalog: { $ref: "#/components/schemas/Catalog" }
        collection: { $ref: "#/components/schemas/Collection" }

    SnapshotChange:
      type: object
      description: |
        One difference between two snapshots. Removed items come first, then
        added, then changed. Semantics: `SnapshotChange` in
        `internal/vault/snapshot_diff.go`.
      required: [op, kind]
      properties:
        op:
          type: string
          enum: [removed, added, changed]
        kind:
          type: string
          enum: [collection, folder, catalog]
        aspect:
          type: string
          enum: [name, recipe, settings, art, order, catalog_order]
        name: { type: string }
        was: { type: string, description: "The earlier name, when it changed." }
        folder: { type: string, description: The folder a catalog is added to or removed from. }
        genre: { type: string }
        key: { type: string, description: Snapshot key of the folder or catalog the item is about. }
        folder_key: { type: string }
        catalog: { $ref: "#/components/schemas/BundleCatalog" }
        was_catalog: { $ref: "#/components/schemas/BundleCatalog" }

    PushRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          description: The whole pending Home, in order.
          items:
            $ref: "#/components/schemas/PushRow"
    PushRow:
      type: object
      additionalProperties: false
      description: One Home row; names exactly one catalog or one collection.
      oneOf:
        - required: [catalog_id]
        - required: [collection_id]
      properties:
        catalog_id: { type: string, format: uuid }
        show_in_home:
          type: boolean
          description: Catalog rows only; false is Discover only.
        collection_id: { type: string, format: uuid }
        pin_to_top:
          type: boolean
          description: Collection rows only; Nuvio shows it first.
    PushResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: True only on a 200. The marker that tells this body from any other; an ordinary failure carries nothing else.
        undo_failed:
          type: boolean
          description: What Nuvio took couldn't be put back; Nuvio holds part of the push.
        refused:
          type: string
          enum: [empty_collection, shares_addons, profile_changed, home_order_unreadable]
          description: Why push turned the Home away before writing anything to Nuvio.
    PendingChange:
      type: object
      required: [kind, id, name, change]
      properties:
        kind:
          type: string
          enum: [catalog, collection]
        id: { type: string, format: uuid }
        name:
          type: string
          description: As a push would send it, or as the last push left it for a removed row.
        change:
          type: string
          enum: [added, changed, removed]

    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    Named:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    TitledMatch:
      type: object
      required: [id, name, origin_country, title_count]
      properties:
        id: { type: integer }
        name: { type: string }
        origin_country: { type: string }
        title_count:
          type: integer
          description: How many titles of the requested type it has (series, for a network).
    Network:
      type: object
      required: [id, name, origin_country]
      properties:
        id: { type: integer }
        name: { type: string }
        origin_country: { type: string }
    Language:
      type: object
      required: [iso_639_1, english_name, name]
      properties:
        iso_639_1: { type: string }
        english_name: { type: string }
        name: { type: string }
    Country:
      type: object
      required: [iso_3166_1, english_name, native_name]
      properties:
        iso_3166_1: { type: string }
        english_name: { type: string }
        native_name: { type: string }
    WatchProvider:
      type: object
      required: [provider_id, provider_name, display_priority, logo_path]
      properties:
        provider_id: { type: integer }
        provider_name: { type: string }
        display_priority: { type: integer }
        logo_path: { type: string }
    Certification:
      type: object
      required: [certification, meaning, order]
      properties:
        certification: { type: string }
        meaning: { type: string }
        order: { type: integer }

    AddonManifest:
      type: object
      required: [id, version, name, description, types, resources, idPrefixes, catalogs, behaviorHints]
      properties:
        id: { type: string, const: hiidz.uno.catalog }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        logo: { type: string, format: uri }
        types:
          type: array
          items: { type: string }
        resources:
          type: array
          items: { type: string }
        idPrefixes:
          type: array
          items: { type: string }
        catalogs:
          type: array
          items:
            type: object
            required: [type, id, name, showInHome]
            properties:
              type: { $ref: "#/components/schemas/CatalogType" }
              id: { type: string, description: "The manifest id, `{provider}-{catalog uuid}`." }
              name: { type: string }
              pageSize: { type: integer }
              extra:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      enum: [skip, genre]
                    isRequired: { type: boolean }
                    options:
                      type: array
                      items: { type: string }
                    optionsLimit: { type: integer }
              showInHome:
                type: boolean
                description: Always present; Nuvio TV reads an absent one as true.
        behaviorHints:
          type: object
          required: [configurable]
          properties:
            configurable: { type: boolean }
    AddonCatalogResponse:
      type: object
      required: [metas, cacheMaxAge, staleRevalidate]
      properties:
        metas:
          type: array
          items:
            $ref: "#/components/schemas/AddonMeta"
        cacheMaxAge: { type: integer, description: Seconds. }
        staleRevalidate: { type: integer, description: Seconds. }
    AddonMeta:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        poster: { type: string }
        background: { type: string }
        description: { type: string }
        releaseInfo: { type: string }
        released: { type: string }
        genres:
          type: array
          items: { type: string }
