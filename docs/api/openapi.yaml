    put:
      tags: [account]
      summary: Save the account's TMDB key
      description: Checks the key with one TMDB call, then stores it encrypted. Nothing is saved if the check fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key:
