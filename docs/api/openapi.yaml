openapi: 3.1.0
info:
  title: Uno
  version: "1"
  description: |
    Uno's HTTP surface: the builder API under `/api`, which the SPA calls, and
    the public Stremio-protocol addon under `/u/{token}`, which Nuvio calls.
    Everything else on the server is the embedded SPA and is not described
    here.

    **Errors.** Unless an operation says otherwise, an error is a plain-text
    body (`text/plain; charset=utf-8`) holding one line of words. Push is an
    exception: past auth, profile resolution and body decoding it answers
    JSON (`PushResult`) whether it succeeds or fails. So is the 404 for a
    profile slot that was never selected, JSON with a `code`
    (`ProfileNotFound`).

    **Request bodies.** Every body is decoded strictly: a field the request
    doesn't have, at any depth, is a 400 naming it (`invalid request body:
    unknown field "name"`). The default limit is 1 MiB, past which the answer
    is 413.

    **Auth.** Every `/api` operation except `GET /api/health` and
    `GET /api/config` takes a Nuvio access token as `Authorization: Bearer`.
    Any of them can answer 401 (missing, malformed, invalid or expired
    token), 403 (an account the server's allowlist doesn't list) or 502
    (`auth service unavailable`: Nuvio's signing keys couldn't be fetched).
    Any operation can answer 500 for a failure of Uno's own.

    **Profiles.** Routes under `/api/p/{profileIndex}` act on the caller's
    Uno profile for that Nuvio profile slot (1–6), created by
    `POST /api/profiles/select`. A slot with no Uno profile is a 404.

    **TMDB keys.** On a server in per-account key mode (`GET /api/config`),
    an operation that reaches TMDB answers 422 when the account has saved no
    TMDB key or TMDB refuses it.

    **Recipes.** A catalog's `params` is its TMDB recipe as a JSON-encoded
    string (`RecipeParams`); a bundle or snapshot catalog carries the same
    recipe as a JSON object. Every recipe a client sends is checked against
    TMDB before anything is written, and stored in canonical form. Field
    rules: `docs/data-model.md`, *Recipe params (TMDB)*.

    Routes and methods here are kept equal to the server's route table by
    `TestOpenAPISpecMatchesRoutes` (`internal/api/openapi_test.go`).
servers:
  - url: /
tags:
  - name: server
    description: Unauthenticated server facts.
  - name: profiles
    description: The caller's Nuvio profiles and the Uno profile for one.
  - name: account
    description: The caller's own TMDB key, on a per-account key server.
  - name: recipes
    description: Running a recipe against TMDB without saving it.
  - name: catalogs
    description: The profile's catalogs.
  - name: collections
    description: The profile's collections.
  - name: publishing
    description: Publishing the profile's own catalogs and collections to Community.
  - name: community
    description: Other profiles' publications, and adding them.
  - name: bundles
    description: Export and import of catalogs and collections as a bundle file.
  - name: push
    description: Writing the profile's Home into Nuvio.
  - name: tmdb
    description: TMDB vocabulary for the recipe editor.
  - name: addon
    description: The public Stremio-protocol addon Nuvio reads.

security:
  - nuvioBearer: []

paths:
  /api/health:
    get:
      tags: [server]
      operationId: health
      summary: Liveness probe
      description: Reads nothing, so it answers while the vault or Nuvio is down.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/config:
    get:
      tags: [server]
      operationId: getConfig
      summary: How the server is set up
      security: []
      responses:
        "200":
          description: The server's TMDB key mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"

  /api/profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: The caller's Nuvio profiles
      description: Nuvio's profile list, each with the picture Nuvio's apps show for it.
      responses:
        "200":
          description: Every profile on the caller's Nuvio account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickerProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/NuvioUnavailable" }

  /api/profiles/select:
    post:
      tags: [profiles]
      operationId: selectProfile
      summary: Pick a Nuvio profile to build for
      description: |
        Matches `profile_index` against the caller's live Nuvio profiles and
        resolves the Uno profile for that slot, creating it on first pick.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_index]
              properties:
                profile_index:
                  type: integer
      responses:
        "200":
          description: The Uno profile, with its addon manifest URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedProfile"
        "400":
          description: The body doesn't decode, or the caller's Nuvio account has no profile at that index.
          content:
            text/plain:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502": { $ref: "#/components/responses/NuvioUnavailable" }

  /api/account/tmdb-key:
    get:
      tags: [account]
      operationId: getTMDBKey
      summary: Whether the caller has saved a TMDB key
      responses:
        "200":
          description: The key's status; the key itself is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TMDBKeyStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SharedKeyMode" }
    put:
      tags: [account]
      operationId: putTMDBKey
      summary: Save the caller's TMDB key
      description: |
        Saves the key, replacing any saved one, once it has the shape of a
        TMDB API key and TMDB accepts it. Nothing is saved otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: A TMDB API Key (32 characters, 0–9 and a–f), not a Read Access Token.
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TMDBKeyStatus"
        "400":
          description: The key isn't shaped like a TMDB API key, or TMDB refused it.
          content:
            text/plain:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SharedKeyMode" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }
    delete:
      tags: [account]
      operationId: deleteTMDBKey
      summary: Remove the caller's TMDB key
      responses:
        "204":
          description: Removed, or there was none.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SharedKeyMode" }

  /api/catalogs/preview:
    post:
      tags: [recipes]
      operationId: previewCatalog
      summary: Run a recipe against TMDB
      description: |
        Returns the first page of titles a recipe finds, saving nothing. The
        provider is always `tmdb`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, params]
              properties:
                type:
                  $ref: "#/components/schemas/CatalogType"
                params:
                  $ref: "#/components/schemas/RecipeParamsString"
                genre:
                  type: string
                  description: A genre name from the recipe's genre options, narrowing the preview.
      responses:
        "200":
          description: The first page of titles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/catalogs/genre-options:
    post:
      tags: [recipes]
      operationId: catalogGenreOptions
      summary: The genres a recipe can be narrowed by
      description: The same list the manifest advertises as the catalog's genre extra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, params]
              properties:
                type:
                  $ref: "#/components/schemas/CatalogType"
                params:
                  $ref: "#/components/schemas/RecipeParamsString"
      responses:
        "200":
          description: The genre options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/p/{profileIndex}/catalogs:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    get:
      tags: [catalogs]
      operationId: listUserCatalogs
      summary: The profile's listed catalogs
      responses:
        "200":
          description: Every listed catalog (none scoped to a collection).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Catalog"
        "400": { $ref: "#/components/responses/BadProfileIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
    post:
      tags: [catalogs]
      operationId: createUserCatalog
      summary: Create a catalog
      description: |
        Creates a listed catalog. A catalog scoped to a collection is created
        only by that collection's save, as a folder's `new` entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogForm"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/p/{profileIndex}/catalogs/{catalogID}:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CatalogID"
    put:
      tags: [catalogs]
      operationId: updateUserCatalog
      summary: Save a catalog
      description: |
        Rewrites a listed catalog. A catalog scoped to a collection is saved
        through its collection's `catalog_edits` instead. An update never
        changes a catalog's scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogForm"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }
    delete:
      tags: [catalogs]
      operationId: deleteUserCatalog
      summary: Delete a catalog
      description: Allowed on a catalog on Home; Nuvio keeps its row until the next push.
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/catalogs/{catalogID}/publish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CatalogID"
    post:
      tags: [publishing]
      operationId: publishCatalog
      summary: Publish a listed catalog, or publish its update
      responses:
        "200":
          description: Published; the catalog with its publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/catalogs/{catalogID}/unpublish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CatalogID"
    post:
      tags: [publishing]
      operationId: unpublishCatalog
      summary: Unpublish a catalog
      description: |
        Deletes its publication. One-way: subscribers keep their copies as
        their own, and publishing again starts a new publication.
      responses:
        "200":
          description: Unpublished; the catalog without a publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/catalogs/{catalogID}/changes-since-publish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CatalogID"
    get:
      tags: [publishing]
      operationId: catalogChangesSincePublish
      summary: What publishing the catalog again would change
      description: The saved catalog against its last snapshot; `[]` if it was never published.
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotChange"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/collections:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    get:
      tags: [collections]
      operationId: listUserCollections
      summary: The profile's collections
      responses:
        "200":
          description: Every collection, each with its folders and scoped catalogs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadProfileIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
    post:
      tags: [collections]
      operationId: createUserCollection
      summary: Create a collection
      description: Every inline new catalog's recipe is checked against TMDB first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionForm"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/p/{profileIndex}/collections/{collectionID}:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CollectionID"
    put:
      tags: [collections]
      operationId: updateUserCollection
      summary: Save a collection
      description: |
        Rewrites the collection, its folders and, through `catalog_edits`, its
        scoped catalogs in one transaction. A subscribed copy can't be saved
        (400). Every inline recipe is checked against TMDB first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionForm"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }
    delete:
      tags: [collections]
      operationId: deleteUserCollection
      summary: Delete a collection
      description: Allowed on a collection on Home; Nuvio keeps it until the next push.
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/collections/{collectionID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CollectionID"
    post:
      tags: [collections]
      operationId: duplicateUserCollection
      summary: Duplicate one of the profile's own collections
      description: Copies the whole tree, scoped catalogs included, in one transaction.
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/collections/{collectionID}/publish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CollectionID"
    post:
      tags: [publishing]
      operationId: publishCollection
      summary: Publish a collection, or publish its update
      description: |
        A subscribed copy is refused; a collection using catalogs added from
        Community is not.
      responses:
        "200":
          description: Published; the collection with its publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/collections/{collectionID}/unpublish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CollectionID"
    post:
      tags: [publishing]
      operationId: unpublishCollection
      summary: Unpublish a collection
      description: |
        Deletes its publication. One-way: subscribers keep their copies as
        their own, and publishing again starts a new publication.
      responses:
        "200":
          description: Unpublished; the collection without a publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/collections/{collectionID}/changes-since-publish:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/CollectionID"
    get:
      tags: [publishing]
      operationId: collectionChangesSincePublish
      summary: What publishing the collection again would change
      description: |
        The saved collection tree, its catalogs included, against its last
        snapshot; `[]` if it was never published.
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotChange"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/p/{profileIndex}/community:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    get:
      tags: [community]
      operationId: listCommunity
      summary: Other profiles' live publications
      description: All of them in one array, newest first; the SPA searches, filters and sorts.
      responses:
        "200":
          description: The publications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityItem"
        "400": { $ref: "#/components/responses/BadProfileIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }

  /api/p/{profileIndex}/community/{publicationID}:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/PublicationID"
    get:
      tags: [community]
      operationId: getPublication
      summary: One publication with its snapshot
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PublicationGone" }

  /api/p/{profileIndex}/community/{publicationID}/changes:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/PublicationID"
    get:
      tags: [community]
      operationId: updateChanges
      summary: What Update would change in the caller's added copy
      description: The caller's copy against the publication's current snapshot.
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotChange"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The caller doesn't subscribe to it, or it is no longer live.
          content:
            text/plain:
              schema:
                type: string

  /api/p/{profileIndex}/community/{publicationID}/subscribe:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/PublicationID"
    post:
      tags: [community]
      operationId: subscribe
      summary: Add a publication
      description: Writes a subscribed copy into the caller's profile. No TMDB call.
      responses:
        "201":
          description: The subscribed copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityCopy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PublicationGone" }
        "409":
          description: Already added.
          content:
            text/plain:
              schema:
                type: string

  /api/p/{profileIndex}/community/{publicationID}/update:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/PublicationID"
    post:
      tags: [community]
      operationId: updateSubscription
      summary: Update the caller's added copy to the publication's latest
      description: Overwrites the subscribed copy, pairing its rows by stable key.
      responses:
        "200":
          description: The updated copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityCopy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PublicationGone" }

  /api/p/{profileIndex}/community/{publicationID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
      - $ref: "#/components/parameters/PublicationID"
    post:
      tags: [community]
      operationId: duplicatePublication
      summary: Duplicate a publication
      description: Writes an editable copy into the caller's profile, with no subscription.
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityCopy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PublicationGone" }

  /api/p/{profileIndex}/export:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    post:
      tags: [bundles]
      operationId: exportBundle
      summary: Export catalogs and collections as a bundle
      description: Only the profile's own ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalog_ids:
                  type: array
                  description: Listed catalogs to export.
                  items:
                    type: string
                    format: uuid
                collection_ids:
                  type: array
                  description: Collections to export, each with its scoped catalogs.
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /api/p/{profileIndex}/import/check:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    post:
      tags: [bundles]
      operationId: checkImport
      summary: Check a bundle before importing it
      description: |
        Validates the bundle and every recipe in it, writes nothing, and
        answers what it holds, each catalog with the caller's listed catalogs
        of the same recipe. The body is decoded strictly (an unknown field is
        a 400 naming it) and capped at 4 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bundle]
              properties:
                bundle:
                  $ref: "#/components/schemas/Bundle"
      responses:
        "200":
          description: What the bundle holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCheck"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/p/{profileIndex}/import:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    post:
      tags: [bundles]
      operationId: importBundle
      summary: Import a bundle
      description: |
        Checks everything afresh, then writes the new rows, all or nothing.
        Strict decoding and the 4 MiB cap as for the check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bundle]
              properties:
                bundle:
                  $ref: "#/components/schemas/Bundle"
                reuse:
                  type: object
                  description: Bundle catalog key → one of the caller's listed catalogs to use instead of importing it. The catalog must hold the same recipe as the bundle catalog it stands in for, else the import is a 400.
                  additionalProperties:
                    type: string
                    format: uuid
                skip_collections:
                  type: array
                  description: Positions of the bundle's collections to leave out, each with its own catalogs.
                  items:
                    type: integer
                    minimum: 0
      responses:
        "201":
          description: The new rows; a reused catalog is not among them.
          content:
            application/json:
              schema:
                type: object
                required: [catalogs, collections]
                properties:
                  catalogs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Catalog"
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/KeyProblem" }
        "502": { $ref: "#/components/responses/TMDBUnavailable" }

  /api/p/{profileIndex}/push:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    post:
      tags: [push]
      operationId: push
      summary: Push the profile's Home into Nuvio
      description: |
        Writes Uno's addon, its collections and the home-order list into the
        Nuvio profile, then stores the Home selection and what was sent. The
        body is the whole pending Home as one ordered list; a row's place is
        its position. Decoded strictly: an unknown field is a 400.

        Past auth, profile resolution and body decoding, every answer is a
        `PushResult`. An ordinary failure leaves nothing changed on either
        side: what Nuvio already took is put back. `undo_failed` marks the
        one case where putting it back failed too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: Pushed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "400":
          description: |
            The body doesn't decode (plain text), a row names an id the profile
            can't push, names neither or both of a catalog and a collection, or
            names a catalog or collection an earlier row already names, or a
            collection on Home has no folders (`refused: empty_collection`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
            text/plain:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }
        "409":
          description: |
            The Nuvio slot is empty now or holds another Nuvio profile
            (`refused: profile_changed`), or the Nuvio profile uses profile 1's
            addons (`refused: shares_addons`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500":
          description: A failure of Uno's own, or (`undo_failed`) Nuvio is left holding part of the push.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "502":
          description: |
            A Nuvio call failed. `refused: home_order_unreadable` when Nuvio's
            home-order list couldn't be read, before anything was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"

  /api/p/{profileIndex}/push/pending:
    parameters:
      - $ref: "#/components/parameters/ProfileIndex"
    get:
      tags: [push]
      operationId: listPendingPush
      summary: What a push of the stored Home would change in Nuvio
      description: |
        Catalog rows first, then collections. Unpushed Home edits live in the
        builder and are not in it.
      responses:
        "200":
          description: The pending changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingChange"
        "400": { $ref: "#/components/responses/BadProfileIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ProfileNotFound" }

