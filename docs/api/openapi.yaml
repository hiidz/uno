      summary: The profile's addon manifest
      description: |
        Stremio addon protocol. Lists the catalogs the profile's last push put
        in Nuvio. Public and CORS-open (`Access-Control-Allow-Origin: *`).
      security: []
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddonManifest"
        "404":
          description: No profile has this token.
          content:
