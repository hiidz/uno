      description: Redirects to the builder's profile picker. The token isn't looked up.
      security: []
      responses:
        "302":
          description: Redirect to `/profiles`.
          headers:
            Location:
              schema: { type: string, const: /profiles }

components:
  securitySchemes:
    nuvioBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Nuvio access token, from Nuvio's auth API. Uno verifies it against
        Nuvio's JWKS, then checks the account against the server's access policy.

  parameters:
    profileIndex:
      name: profileIndex
      in: path
      required: true
      description: The Nuvio profile slot, picked first with `POST /api/profiles/select`.
      schema: { type: integer, minimum: 1, maximum: 6 }
    catalogID:
      name: catalogID
      in: path
      required: true
      schema: { type: string, format: uuid }
    collectionID:
      name: collectionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    publicationID:
      name: publicationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    catalogType:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CatalogType" }
    tmdbID:
      name: id
      in: path
      required: true
      description: A TMDB id.
      schema: { type: integer }
    token:
      name: token
      in: path
      required: true
      description: The profile's addon token.
      schema: { type: string }
    manifestCatalogID:
      name: id
      in: path
      required: true
      description: The catalog's manifest id, `tmdb-{catalog uuid}`.
      schema: { type: string }

  headers:
    CORS:
      schema: { type: string, const: "*" }

  responses:
    BadRequest:
      description: Bad input. The message says what.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, invalid or expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The access policy doesn't admit this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProfileNotFound:
      description: The profile slot was never picked. `code` is `profile_not_found`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The row doesn't exist or isn't the caller's, or the slot was never picked (`code` `profile_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotOnTMDB:
      description: TMDB has nothing with that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The row changed since the editor loaded it (`Error saving.`), or the request conflicts with the row's state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The request body is over its limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyProblem:
      description: Per-account key mode only. The account has no TMDB key yet, or TMDB rejected it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Uno failed. The message says what, never why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Upstream:
      description: TMDB, Nuvio or Nuvio's JWKS couldn't be reached or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CatalogPage:
      description: One page of titles.
      headers:
        Access-Control-Allow-Origin: { $ref: "#/components/headers/CORS" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CatalogResponse" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Set for errors the web app handles by kind.
          enum: [profile_not_found]

    ServerConfig:
      type: object
      required: [tmdb_key_mode]
      properties:
        tmdb_key_mode:
          type: string
          enum: [shared, per-account]

    TMDBKeyStatus:
      type: object
      required: [set]
      properties:
        set: { type: boolean }
        last4:
          type: string
          description: The saved key's last four characters. Absent when `set` is false.

    NuvioProfile:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        profile_index: { type: integer, minimum: 1, maximum: 6 }
        name: { type: string }
        uses_primary_addons:
          type: boolean
          description: The profile uses profile 1's addons. Push refuses such a profile.
        avatar_color_hex: { type: string }
        avatar_id: { type: string }
        avatar_url: { type: string }
        pin_enabled: { type: boolean }
        avatar_image_url:
          type: string
          description: The picture Nuvio's apps show for the profile, or "" when they show its colour.

    CatalogType:
      type: string
      enum: [movie, series]

    CatalogForm:
      type: object
      required: [type, name, provider, params]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string, maxLength: 200 }
        provider: { type: string, const: tmdb }
        params:
          type: string
          maxLength: 8192
          description: The recipe params as a JSON-encoded string. See docs/data-model.md, Recipes.
          examples: ['{"sort_by":"popularity.desc","with_genres":"878"}']

    CatalogSave:
      allOf:
        - $ref: "#/components/schemas/CatalogForm"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              description: The revision the editor's form was built from.

    PublicationState:
      type: [object, "null"]
      required: [id, changed_since_publish]
      properties:
        id: { type: string, format: uuid }
        changed_since_publish: { type: boolean }

    SubscriptionState:
      type: [object, "null"]
      required: [publication_id, update_available]
      properties:
        publication_id: { type: string, format: uuid }
        update_available: { type: boolean }

    Catalog:
      type: object
      required: [id, type, name, provider, params, collection_id, home_position, show_in_home, revision, publication, subscription]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        provider: { type: string, const: tmdb }
        params:
          type: string
          description: Canonical recipe params, as a JSON-encoded string.
        collection_id:
          type: [string, "null"]
          format: uuid
          description: The collection this catalog is scoped to, or null for a listed catalog.
        home_position:
          type: [integer, "null"]
          description: Place on Home, shared with collections. Null when not on Home.
        show_in_home:
          type: boolean
          description: On Home with a home row (true), or only in Discover (false).
        revision: { type: integer }
        publication: { $ref: "#/components/schemas/PublicationState" }
        subscription: { $ref: "#/components/schemas/SubscriptionState" }

    TileShape:
      type: string
      enum: [POSTER, LANDSCAPE, SQUARE]

    ViewMode:
      type: string
      enum: [TABBED_GRID, ROWS]

    FolderArt:
      type: object
      properties:
        tile_shape: { $ref: "#/components/schemas/TileShape" }
        hide_title: { type: boolean }
        cover_emoji: { type: string, maxLength: 32 }
        cover_image_url: { type: string, maxLength: 2048 }
        focus_gif_url: { type: string, maxLength: 2048 }
        focus_gif_enabled: { type: boolean }
        hero_backdrop_url: { type: string, maxLength: 2048 }
        hero_video_url: { type: string, maxLength: 2048 }
        title_logo_url: { type: string, maxLength: 2048 }

    FolderRef:
      type: object
      required: [catalog_id, genre]
      properties:
        catalog_id: { type: string, format: uuid }
        genre:
          type: string
          description: The genre this reference is narrowed to, or "" for unfiltered.

    Folder:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          required: [id, title, refs]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            refs:
              type: array
              items: { $ref: "#/components/schemas/FolderRef" }

    Collection:
      type: object
      description: A collection with its folders, and every catalog those folders reference.
      required: [id, title, pin_to_top, view_mode, show_all_tab, backdrop_image_url, focus_glow_enabled, home_position, revision, publication, subscription, folders, catalogs]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        pin_to_top: { type: boolean }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string }
        focus_glow_enabled: { type: boolean }
        home_position: { type: [integer, "null"] }
        revision: { type: integer }
        publication: { $ref: "#/components/schemas/PublicationState" }
        subscription: { $ref: "#/components/schemas/SubscriptionState" }
        folders:
          type: array
          items: { $ref: "#/components/schemas/Folder" }
        catalogs:
          type: array
          items: { $ref: "#/components/schemas/Catalog" }

    NewScopedCatalog:
      type: object
      required: [key, type, name, provider, params]
      additionalProperties: false
      properties:
        key:
          type: string
          description: The client's handle for one new catalog, unique within the save. Entries with the same key share one catalog.
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        provider: { type: string, const: tmdb }
        params: { type: string }

    FolderCatalogRef:
      type: object
      description: Exactly one of `catalog_id` or `new`.
      additionalProperties: false
      properties:
        catalog_id: { type: string, format: uuid }
        new: { $ref: "#/components/schemas/NewScopedCatalog" }
        genre: { type: string, maxLength: 64 }

    FolderData:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          required: [title, catalogs]
          properties:
            id:
              type: string
              format: uuid
              description: An existing folder's id. Omit for a new folder.
            title: { type: string, maxLength: 200 }
            catalogs:
              type: array
              description: In order.
              items: { $ref: "#/components/schemas/FolderCatalogRef" }

    ScopedCatalogEdit:
      type: object
      required: [id, type, provider, name, params]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CatalogType" }
        provider: { type: string, const: tmdb }
        name: { type: string }
        params: { type: string }

    CollectionForm:
      type: object
      required: [title, view_mode, folders]
      properties:
        title: { type: string, maxLength: 200 }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string, maxLength: 2048 }
        focus_glow_enabled: { type: boolean }
        folders:
          type: array
          items: { $ref: "#/components/schemas/FolderData" }
        catalog_edits:
          type: array
          description: Update only. New names and recipes for catalogs already scoped to this collection.
          items: { $ref: "#/components/schemas/ScopedCatalogEdit" }

    CollectionSave:
      allOf:
        - $ref: "#/components/schemas/CollectionForm"
        - type: object
          required: [revision]
          properties:
            revision: { type: integer }

    PendingChange:
      type: object
      required: [kind, id, name, change]
      properties:
        kind: { type: string, enum: [catalog, collection] }
        id: { type: string, format: uuid }
        name: { type: string }
        change: { type: string, enum: [added, changed, removed] }

    Library:
      type: object
      required: [catalogs, collections, pending, home_revision]
      properties:
        catalogs:
          type: array
          description: Listed catalogs.
          items: { $ref: "#/components/schemas/Catalog" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        pending:
          type: array
          description: What a push of the stored Home would change in Nuvio.
          items: { $ref: "#/components/schemas/PendingChange" }
        home_revision:
          type: integer
          description: Send it with the next push.

    PushRow:
      type: object
      description: One Home row. Exactly one of `catalog_id` or `collection_id`.
      additionalProperties: false
      properties:
        catalog_id: { type: string, format: uuid }
        show_in_home:
          type: boolean
          description: For a catalog. False puts it in Discover only.
        collection_id: { type: string, format: uuid }
        pin_to_top:
          type: boolean
          description: For a collection. Nuvio shows it first.

    PushRequest:
      type: object
      required: [rows, home_revision]
      additionalProperties: false
      properties:
        rows:
          type: array
          description: The whole home screen, in order. Each row at most once.
          items: { $ref: "#/components/schemas/PushRow" }
        home_revision: { type: integer }

    PushResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: True only on a 200.
        undo_failed:
          type: boolean
          description: Putting back Nuvio's lists after a failure failed too.
        refused:
          type: string
          enum: [empty_collection, too_many_catalogs, profile_changed, shares_addons, home_order_unreadable]
        home_revision:
          type: integer
          description: On success, the profile's new home revision.

    CommunityFolder:
      type: object
      properties:
        title: { type: string }
        tile_shape: { $ref: "#/components/schemas/TileShape" }
        cover_emoji: { type: string }
        cover_image_url: { type: string }

    CommunityItem:
      type: object
      required: [id, kind, title, subscriber_count, published_at, updated_at, subscribed, update_available]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [catalog, collection] }
        title: { type: string }
        subscriber_count: { type: integer }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        subscribed:
          type: boolean
          description: The caller has added it.
        update_available: { type: boolean }
        catalog_names:
          type: array
          items: { type: string }
        folders:
          type: array
          items: { $ref: "#/components/schemas/CommunityFolder" }
        catalog:
          oneOf:
            - $ref: "#/components/schemas/BundleCatalog"
            - type: "null"

    CommunityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommunityItem" }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    SnapshotFolder:
      allOf:
        - $ref: "#/components/schemas/BundleFolder"
        - type: object
          required: [key]
          properties:
            key: { type: string }

    Snapshot:
      type: object
      required: [format, version, catalogs]
      properties:
        format: { type: string }
        version: { type: integer }
        catalogs:
          type: array
          items: { $ref: "#/components/schemas/BundleCatalog" }
        collection:
          type: object
          description: Present for a collection publication.
          properties:
            title: { type: string }
            view_mode: { $ref: "#/components/schemas/ViewMode" }
            show_all_tab: { type: boolean }
            backdrop_image_url: { type: string }
            focus_glow_enabled: { type: boolean }
            folders:
              type: array
              items: { $ref: "#/components/schemas/SnapshotFolder" }

    PublicationDetail:
      allOf:
        - $ref: "#/components/schemas/CommunityItem"
        - type: object
          required: [snapshot]
          properties:
            snapshot: { $ref: "#/components/schemas/Snapshot" }

    CommunityCopy:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [catalog, collection] }
        catalog: { $ref: "#/components/schemas/Catalog" }
        collection: { $ref: "#/components/schemas/Collection" }

    SnapshotChange:
      type: object
      required: [op, kind]
      properties:
        op: { type: string, enum: [removed, added, changed] }
        kind: { type: string, enum: [collection, folder, catalog] }
        aspect:
          type: string
          enum: [name, recipe, settings, art, order, catalog_order]
        name: { type: string }
        was: { type: string }
        folder: { type: string }
        genre: { type: string }
        key: { type: string }
        folder_key: { type: string }
        catalog: { $ref: "#/components/schemas/BundleCatalog" }
        was_catalog: { $ref: "#/components/schemas/BundleCatalog" }

    BundleCatalog:
      type: object
      required: [key, name, type, provider, params]
      additionalProperties: false
      properties:
        key: { type: string, maxLength: 64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/CatalogType" }
        provider: { type: string, const: tmdb }
        params:
          type: object
          description: The recipe params as a JSON object (not a string).

    BundleRef:
      type: object
      required: [catalog, genre]
      properties:
        catalog:
          type: string
          description: A catalog key in the bundle.
        genre: { type: string }

    BundleFolder:
      allOf:
        - $ref: "#/components/schemas/FolderArt"
        - type: object
          required: [title, refs]
          properties:
            title: { type: string }
            refs:
              type: array
              items: { $ref: "#/components/schemas/BundleRef" }

    BundleCollection:
      type: object
      required: [title, view_mode, catalogs, folders]
      properties:
        title: { type: string }
        view_mode: { $ref: "#/components/schemas/ViewMode" }
        show_all_tab: { type: boolean }
        backdrop_image_url: { type: string }
        focus_glow_enabled: { type: boolean }
        catalogs:
          type: array
          description: Catalogs scoped to this collection.
          items: { $ref: "#/components/schemas/BundleCatalog" }
        folders:
          type: array
          items: { $ref: "#/components/schemas/BundleFolder" }

    Bundle:
      type: object
      required: [format, version, catalogs, collections]
      properties:
        format: { type: string, const: uno }
        version: { type: integer, const: 1 }
        catalogs:
          type: array
          maxItems: 200
          description: Listed catalogs.
          items: { $ref: "#/components/schemas/BundleCatalog" }
        collections:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BundleCollection" }

    CheckCatalog:
      type: object
      required: [key, name, type, params, existing]
      properties:
        key: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/CatalogType" }
        params:
          type: string
          description: Canonical params, as a JSON-encoded string.
        existing:
          type: array
          description: The caller's listed catalogs with the same recipe, which the import may reuse.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    ImportCheck:
      type: object
      required: [catalogs, collections]
      properties:
        catalogs:
          type: array
          items: { $ref: "#/components/schemas/CheckCatalog" }
        collections:
          type: array
          items:
            type: object
            required: [title, folders, matched, catalogs]
            properties:
              title: { type: string }
              folders:
                type: array
                description: Folder titles.
                items: { type: string }
              matched:
                type: boolean
                description: One of the caller's collections has the same title, ignoring case.
              catalogs:
                type: array
                items: { $ref: "#/components/schemas/CheckCatalog" }

    PreviewItem:
      type: object
      properties:
        tmdb_id: { type: integer }
        title: { type: string }
        year: { type: string }
        poster: { type: string }

    CatalogPreview:
      type: object
      required: [randomized, items, total_results]
      properties:
        randomized:
          type: boolean
          description: The recipe shuffles, so Nuvio shows a different page.
        items:
          type: array
          items: { $ref: "#/components/schemas/PreviewItem" }
        total_results:
          type: integer
          description: TMDB's count of matches across every page.

    Genre:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Certification:
      type: object
      properties:
        certification: { type: string }
        meaning: { type: string }
        order:
          type: integer
          description: The rating's rank on its country's scale, lowest first.

    Language:
      type: object
      properties:
        iso_639_1: { type: string }
        english_name: { type: string }
        name: { type: string }

    Country:
      type: object
      properties:
        iso_3166_1: { type: string }
        english_name: { type: string }
        native_name: { type: string }

    WatchProvider:
      type: object
      properties:
        provider_id: { type: integer }
        provider_name: { type: string }
        display_priority: { type: integer }
        logo_path: { type: string }

    WatchRegion:
      type: object
      properties:
        iso_3166_1: { type: string }
        english_name: { type: string }
        native_name: { type: string }

    NamedID:
      type: object
      description: A TMDB company, keyword or collection.
      properties:
        id: { type: integer }
        name: { type: string }

    CompanyMatch:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        origin_country: { type: string }
        title_count:
          type: integer
          description: Titles of the searched catalog type.

    Network:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        origin_country: { type: string }

    NetworkMatch:
      allOf:
        - $ref: "#/components/schemas/Network"
        - type: object
          properties:
            title_count: { type: integer }

    Manifest:
      type: object
      description: A Stremio addon manifest.
      properties:
        id: { type: string, const: hiidz.uno.catalog }
        version: { type: string }
        name: { type: string, const: Uno Catalog }
        description: { type: string }
        logo:
          type: string
          description: "`{SITE_BASE_URL}/logo.png`"
        types:
          type: array
          items: { type: string }
          examples: [[movie, series]]
        resources:
          type: array
          items: { type: string }
          examples: [[catalog]]
        idPrefixes:
          type: array
          items: { type: string }
          examples: [[tt]]
        catalogs:
          type: array
          items:
            type: object
            properties:
              type: { $ref: "#/components/schemas/CatalogType" }
              id:
                type: string
                description: "`tmdb-{catalog uuid}`"
              name: { type: string }
              pageSize: { type: integer, const: 20 }
              showInHome: { type: boolean }
              extra:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, enum: [skip, genre] }
                    isRequired: { type: boolean }
                    options:
                      type: array
                      items: { type: string }
                    optionsLimit: { type: integer }
        behaviorHints:
          type: object
          properties:
            configurable: { type: boolean }

    Meta:
      type: object
      description: A Stremio meta preview.
      required: [id, type, name]
      properties:
        id:
          type: string
          description: The title's IMDb id.
        type: { $ref: "#/components/schemas/CatalogType" }
        name: { type: string }
        poster: { type: string }
        background: { type: string }
        description: { type: string }
        releaseInfo: { type: string }
        released: { type: string }
        genres:
          type: array
          items: { type: string }

    CatalogResponse:
      type: object
      required: [metas, cacheMaxAge, staleRevalidate]
      properties:
        metas:
          type: array
          items: { $ref: "#/components/schemas/Meta" }
        cacheMaxAge: { type: integer, const: 10800 }
        staleRevalidate: { type: integer, const: 3600 }
