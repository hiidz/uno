# The project's full check set, run on every push to main and every pull
# request. Go tests run under the race detector here, which needs cgo and so
# can't run on a Windows machine without a C toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's earlier run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # The default max-same-issues of 3 truncates repeated findings.
          args: --max-same-issues=0 --max-issues-per-linter=0
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  web:
    runs-on: ubuntu-latest
    # A render loop inside a test blocks vitest's own per-test timeout, so this
    # is what ends a hung run.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
