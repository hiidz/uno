# The check set the README lists, run on every push to main and every pull
# request. Go tests run under the race detector here, which needs cgo and so
# can't run on a Windows machine without a C toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # The default max-same-issues of 3 truncates repeated findings.
          args: --max-same-issues=0 --max-issues-per-linter=0
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  web:
    runs-on: ubuntu-latest
    # A render loop inside a test blocks vitest's own per-test timeout, so this
    # is what ends a hung run.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        # The build only type-checks and bundles; vite.config.ts needs these
        # set, not valid.
        env:
          VITE_NUVIO_BASE_URL: https://api.nuvio.tv
          VITE_NUVIO_PUBLISHABLE_KEY: ci-placeholder
      - run: npm test
