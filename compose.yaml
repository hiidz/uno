services:
  uno:
    build:
      context: .
      # Baked into the SPA at build time, from the same root .env the server reads.
      args:
        NUVIO_BASE_URL: ${NUVIO_BASE_URL:-https://api.nuvio.tv}
        NUVIO_PUBLISHABLE_KEY: ${NUVIO_PUBLISHABLE_KEY}
    image: uno
    restart: unless-stopped
    # Longer than the server's 60s shutdown drain (shutdownGracePeriod in
    # cmd/uno/main.go), so a push in flight finishes before the SIGKILL.
    stop_grace_period: 70s
    env_file: .env
    environment:
      # Overrides whatever VAULT_DB is set to in .env — the vault has to
      # live on the mounted volume below to survive a container recreate.
      VAULT_DB: /data/vault.db
    volumes:
      - uno-data:/data
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  uno-data:
